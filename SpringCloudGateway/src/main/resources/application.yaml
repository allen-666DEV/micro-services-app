spring:
  application:
    name: ApiGateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: product-service
              uri: lb://ProductService
              predicates:
                - Path=/products/**

            - id: inventory-service
              uri: lb://InventoryService
              predicates:
                - Path=/inventory/**

            - id: order-service
              uri: lb://OrderService
              predicates:
                - Path=/orders/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/